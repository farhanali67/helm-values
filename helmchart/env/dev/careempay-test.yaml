# Helm values auto-generated by DevOps Self-Service Agent
# Application: careempay-test
# Environment: dev

replicaCount: 1

image:
  repository: "careempay-test"
  tag: "latest"
  pullPolicy: Always

nameOverride: "careempay-test"
fullnameOverride: "careempay-test"

service:
  type: ClusterIP
  port: 8080


ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
  hosts:
    - host: "tok-pay-api.tap.company"
      paths:
        - path: "/v1"
          pathType: Prefix


resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "200m"
    memory: "400Mi"

livenessProbe:
  httpGet:
    path: "/health"
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/health"
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  - name: ENVIRONMENT
    value: "dev"
  - name: APPLICATION_NAME
    value: "careempay-test"
  - name: TIER
    value: "backend"


  - name: "LOG_LEVEL"
    value: "INFO"

  - name: "REGION"
    value: "us-east-1"




secretEnabled: true
secrets:

  - name: "API_KEY"
    valueFrom:
      secretKeyRef:
        name: "careempay-test-secrets"
        key: "API_KEY"

  - name: "DB_PASSWORD"
    valueFrom:
      secretKeyRef:
        name: "careempay-test-secrets"
        key: "DB_PASSWORD"



labels:
  app: "careempay-test"
  environment: "dev"
  tier: "backend"
  vertical: "payments"
  productline: "token"
  team: "PMO"

  owner: "murtaza"


  service: "checkout"


namespace: "tapapps"