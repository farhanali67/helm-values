# =========================
# App metadata
# =========================
appName:
  name: careempay-test
  namespace: tapapps
  environment: dev

labels:
  app: careempay-test-deployment
  name: careempay-test
  instance: careempay-test-deployment
  tier: backend

# =========================
# Deployment
# =========================
replicaCount: 1

image:
  repository: careempay-test
  tag: careempay-test-dev-latest

# =========================
# Resources
# =========================
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "200m"
    memory: "400Mi"

# =========================
# Health Checks
# =========================
livenessProbe:
  httpGet:
    path: /health
    port: 8080

readinessProbe:
  httpGet:
    path: /health
    port: 8080

# =========================
# Service
# =========================
service:
  type: ClusterIP
  port: 8080

# =========================
# Ingress
# =========================
ingress:
  external:

    enabled: true
    hosts:
      - host: tok-pay-api.tap.company
        paths:
          - path: /v1
            pathType: Prefix
    healthcheckPath: /health

  internal:

    enabled: true
    hosts:
      - host: tok-pay-api.tap.internal
        paths:
          - path: /v1
            pathType: Prefix
    healthcheckPath: /health


# =========================
# External Secrets
# =========================
externalSecret:

  enabled: true

  includeDb: true

# =========================
# ArgoCD
# =========================
argocd:
  name: careempay-test
  enabled: false
  valueFiles:
    - env/dev/careempay-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tapapps
  syncPolicy:
    prune: true
    selfHeal: true